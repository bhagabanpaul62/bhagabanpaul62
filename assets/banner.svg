<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Bhagaban Paul, Forward Deployed Engineer at Vyohm AI and founder of Triakshi AI">
<style>
.name tspan { opacity: 0; animation: ch .01s steps(1, end) forwards; }
@keyframes ch { to { opacity: 1; } }
.rule { stroke-dasharray: 340; stroke-dashoffset: 340; animation: draw .9s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: 1.15s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.prompt { opacity: 0; animation: ch .01s steps(1, end) forwards; animation-delay: 1.50s; }
.caret { opacity: 0; animation: caret-x 30.0s linear infinite, blink 1s steps(2, start) infinite, ch .01s steps(1,end) forwards; animation-delay: 1.50s, 0s, 1.50s; }
@keyframes blink { to { visibility: hidden; } }
.chip { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.glow { transform-box: fill-box; transform-origin: center; }
.g1 { animation: drift1 16s ease-in-out infinite alternate; }
.g2 { animation: drift2 19s ease-in-out infinite alternate; }
.g3 { animation: drift3 13s ease-in-out infinite alternate; }
@keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(70px,40px) scale(1.15); } }
@keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-90px,-30px) scale(1.1); } }
@keyframes drift3 { from { transform: translate(0,0) scale(1); } to { transform: translate(-50px,60px) scale(0.9); } }
.p { animation: float linear infinite; }
@keyframes float { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: var(--o); } 85% { opacity: var(--o); } 100% { transform: translateY(-140px); opacity: 0; } }

.clip0 { animation: clip0 30.0s linear infinite; animation-delay: 1.50s; }
@keyframes clip0 {
  0% { width: 0; }
  2.000% { width: 0; animation-timing-function: steps(36, end); }
  8.600% { width: 561.6px; }
  19.267% { width: 561.6px; animation-timing-function: steps(36, end); }
  21.907% { width: 0; }
  100% { width: 0; }
}
.clip1 { animation: clip1 30.0s linear infinite; animation-delay: 1.50s; }
@keyframes clip1 {
  0% { width: 0; }
  23.907% { width: 0; animation-timing-function: steps(39, end); }
  31.057% { width: 608.4px; }
  41.723% { width: 608.4px; animation-timing-function: steps(39, end); }
  44.583% { width: 0; }
  100% { width: 0; }
}
.clip2 { animation: clip2 30.0s linear infinite; animation-delay: 1.50s; }
@keyframes clip2 {
  0% { width: 0; }
  46.583% { width: 0; animation-timing-function: steps(42, end); }
  54.283% { width: 655.2px; }
  64.950% { width: 655.2px; animation-timing-function: steps(42, end); }
  68.030% { width: 0; }
  100% { width: 0; }
}
.clip3 { animation: clip3 30.0s linear infinite; animation-delay: 1.50s; }
@keyframes clip3 {
  0% { width: 0; }
  70.030% { width: 0; animation-timing-function: steps(40, end); }
  77.363% { width: 624.0px; }
  88.030% { width: 624.0px; animation-timing-function: steps(40, end); }
  90.963% { width: 0; }
  100% { width: 0; }
}@keyframes caret-x {
  0% { transform: translateX(0); }
  2.000% { transform: translateX(0); animation-timing-function: steps(36, end); }
  8.600% { transform: translateX(561.6px); }
  19.267% { transform: translateX(561.6px); animation-timing-function: steps(36, end); }
  21.907% { transform: translateX(0); }
  23.907% { transform: translateX(0); animation-timing-function: steps(39, end); }
  31.057% { transform: translateX(608.4px); }
  41.723% { transform: translateX(608.4px); animation-timing-function: steps(39, end); }
  44.583% { transform: translateX(0); }
  46.583% { transform: translateX(0); animation-timing-function: steps(42, end); }
  54.283% { transform: translateX(655.2px); }
  64.950% { transform: translateX(655.2px); animation-timing-function: steps(42, end); }
  68.030% { transform: translateX(0); }
  70.030% { transform: translateX(0); animation-timing-function: steps(40, end); }
  77.363% { transform: translateX(624.0px); }
  88.030% { transform: translateX(624.0px); animation-timing-function: steps(40, end); }
  90.963% { transform: translateX(0); }
  100% { transform: translateX(0); }
}</style>
