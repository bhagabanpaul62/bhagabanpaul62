# Draws the contribution snake for the profile README into the `output`
# branch, twice a day and on every push to main. The README embeds the
# dark and light SVGs from that branch.
name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Colors match the README banner: violet-to-cyan snake, indigo dots
          outputs: |
            dist/github-snake-dark.svg?color_snake=#a78bfa&color_dots=#161b22,#2b2f6b,#3f3fa8,#5b5be0,#8b8bff
            dist/github-snake.svg?color_snake=#7c3aed&color_dots=#ebedf0,#c7d2fe,#a5b4fc,#818cf8,#6366f1

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
